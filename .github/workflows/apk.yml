name: Fabriquer l'APK

on:
  push:
    paths-ignore: ['web/**', '.github/workflows/web.yml', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler
        run: ./gradlew --no-daemon assembleRelease
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk radioP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: radioP-apk
          path: radioP.apk
